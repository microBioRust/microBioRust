on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "microbiorust-r/src/rust -> target"

      # --- THE FIX STARTS HERE ---
      - name: Bundle workspace for R CMD check
        run: |
          # 1. Copy the sibling crate into the R package so it gets zipped into the tarball
          cp -r seqmetrics microbiorust-r/src/rust/seqmetrics
          
          # 2. Rewrite the path in Cargo.toml to point to this new internal folder
          sed -i.bak 's|path *= *"[^"]*seqmetrics"|path = "./seqmetrics"|g' microbiorust-r/src/rust/Cargo.toml
          
          # 3. Clean up the backup file sed creates
          rm microbiorust-r/src/rust/Cargo.toml.bak
      # --- THE FIX ENDS HERE ---

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: microbiorust-r
          extra-packages: any::rcmdcheck
          needs: check

      - name: Run R CMD Check
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: microbiorust-r
        env:
          _R_CHECK_CRAN_INCOMING_: false
